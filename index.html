<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="/favicon.png" />

  <!-- Web App Manifest -->
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Mobile Responsive -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- Browser Theme Color -->
  <meta
    name="theme-color"
    content="#1F5E3B"
  />

  <!-- SEO -->
  <meta
    name="description"
    content="Book trusted electricians, plumbers, carpenters, painters, AC technicians, cleaners and other verified home service professionals with Fixzzy. Fast booking, transparent pricing and reliable service at your doorstep."
  />

  <meta
    name="keywords"
    content="Fixzzy, Home Services, Electrician, Plumber, Carpenter, AC Repair, Painter, Home Cleaning, India"
  />

  <meta
    name="robots"
    content="index,follow"
  />

  <!-- Canonical -->
  <link
    rel="canonical"
    href="https://fixzzy.in"
  />

  <!-- Open Graph -->
  <meta
    property="og:title"
    content="Fixzzy | Your Trusted Home Partner"
  />

  <meta
    property="og:description"
    content="Book trusted home services with Fixzzy. Fast booking, transparent pricing and verified professionals at your doorstep."
  />

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:url"
    content="https://fixzzy.in"
  />

  <meta
    property="og:image"
    content="https://fixzzy.in/fixzzy-logo.png"
  />

  <!-- Twitter -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="Fixzzy | Your Trusted Home Partner"
  />

  <meta
    name="twitter:description"
    content="Book trusted home services with Fixzzy. Verified professionals for every home."
  />

  <meta
    name="twitter:image"
    content="https://fixzzy.in/fixzzy-logo.png"
  />
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://fixzzy.in/#organization",
      "name": "Fixzzy",
      "url": "https://fixzzy.in",
      "logo": "https://fixzzy.in/favicon.png"
    },
    {
      "@type": "WebSite",
      "@id": "https://fixzzy.in/#website",
      "url": "https://fixzzy.in",
      "name": "Fixzzy",
      "publisher": {
        "@id": "https://fixzzy.in/#organization"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://fixzzy.in/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    },
    {
      "@type": "LocalBusiness",
      "@id": "https://fixzzy.in/#business",
      "name": "Fixzzy",
      "url": "https://fixzzy.in",
      "image": "https://fixzzy.in/favicon.png",
      "description": "Fixzzy connects customers with trusted home service professionals including electricians, plumbers, AC technicians, painters, carpenters, cleaners and more.",
      "areaServed": {
        "@type": "Country",
        "name": "India"
      },
      "priceRange": "₹₹"
    }
  ]
}
</script>

  <title>Fixzzy | Your Trusted Home Partner</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
